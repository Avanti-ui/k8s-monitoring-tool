[project]
name = "k8s-monitoring-backend"
version = "1.0.0"
description = "FastAPI backend for Kubernetes Observability & Monitoring Dashboard"
authors = [{ name = "K8s Monitoring Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "kubernetes>=29.0.0",
    "pyyaml>=6.0.1",
    "motor>=3.4.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
