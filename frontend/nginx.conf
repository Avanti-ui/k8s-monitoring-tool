server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing - serve index.html for all client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to backend service in Kubernetes
    location /api/ {
        proxy_pass http://k8s-monitor-backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy health check endpoint
    location /health {
        proxy_pass http://k8s-monitor-backend:4000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
